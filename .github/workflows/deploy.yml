name: Déployer l'automatisation 1688

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopping-pour-tous-1688-images-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Vérifier la sécurité du traitement
        run: npm test

      - name: Vérifier les quatre secrets privés
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BIGCOMMERCE_STORE_HASH: ${{ secrets.BIGCOMMERCE_STORE_HASH }}
          BIGCOMMERCE_1688_ACCESS_TOKEN: ${{ secrets.BIGCOMMERCE_1688_ACCESS_TOKEN }}
          SPT_1688_CONNECTOR_TOKEN: ${{ secrets.SPT_1688_CONNECTOR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN manquant'; exit 1; }
          test -n "$BIGCOMMERCE_STORE_HASH" || { echo 'BIGCOMMERCE_STORE_HASH manquant'; exit 1; }
          test -n "$BIGCOMMERCE_1688_ACCESS_TOKEN" || { echo 'BIGCOMMERCE_1688_ACCESS_TOKEN manquant'; exit 1; }
          test -n "$SPT_1688_CONNECTOR_TOKEN" || { echo 'SPT_1688_CONNECTOR_TOKEN manquant'; exit 1; }

      - name: Déterminer le compte Cloudflare sans afficher la clé
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          account_id="$(node --input-type=module <<'NODE'
          const response = await fetch('https://api.cloudflare.com/client/v4/accounts?per_page=50', {
            headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` }
          });
          const payload = await response.json();
          if (!response.ok || payload.success !== true || !Array.isArray(payload.result)) process.exit(1);
          if (payload.result.length !== 1) {
            console.error('Le jeton Cloudflare doit être limité à un seul compte.');
            process.exit(1);
          }
          process.stdout.write(String(payload.result[0].id || ''));
          NODE
          )"
          test -n "$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Installer les secrets du Worker sans les afficher
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BIGCOMMERCE_STORE_HASH: ${{ secrets.BIGCOMMERCE_STORE_HASH }}
          BIGCOMMERCE_1688_ACCESS_TOKEN: ${{ secrets.BIGCOMMERCE_1688_ACCESS_TOKEN }}
          SPT_1688_CONNECTOR_TOKEN: ${{ secrets.SPT_1688_CONNECTOR_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const secrets = {
            BIGCOMMERCE_STORE_HASH: process.env.BIGCOMMERCE_STORE_HASH,
            BIGCOMMERCE_ACCESS_TOKEN: process.env.BIGCOMMERCE_1688_ACCESS_TOKEN,
            SPT_1688_CONNECTOR_TOKEN: process.env.SPT_1688_CONNECTOR_TOKEN
          };
          if (Object.values(secrets).some(value => !value)) process.exit(1);
          fs.writeFileSync('/tmp/spt-1688-secrets.json', JSON.stringify(secrets), { mode: 0o600 });
          NODE
          npx wrangler secret bulk /tmp/spt-1688-secrets.json --config wrangler.jsonc
          rm -f /tmp/spt-1688-secrets.json

      - name: Déployer le Worker séparé
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Vérifier le Worker publié
        run: |
          set -euo pipefail
          base='https://shopping-pour-tous-1688-images.shoppingpourtous2026.workers.dev'
          curl --fail --silent --show-error --max-time 20 "$base/health" -o /tmp/spt-1688-health.json
          node -e "const d=require('/tmp/spt-1688-health.json'); if(d.ok!==true||d.service!=='shopping-pour-tous-1688-images') process.exit(1)"
